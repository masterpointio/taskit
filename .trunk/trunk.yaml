version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.8
    - trivy@0.72.0
    - yamllint@1.38.0
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - trufflehog@3.96.0
    - zizmor@1.28.0
  definitions:
    - name: zizmor
      environment:
        # Optional token here so that it's not needed locally, but can be used
        # when trunk is called from our lint workflow in GHA
        - name: ZIZMOR_GITHUB_TOKEN
          value: ${env.GITHUB_TOKEN}
          optional: true
      commands:
        # Set to pedantic so that zizmor will run its stale-action-refs audit rule
        - name: lint
          run: zizmor --format=sarif --persona=pedantic ${target}
  ignore:
    - linters: [ALL]
      paths:
        - CHANGELOG.md
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
actions:
  disabled:
    - trunk-check-pre-push
  enabled:
    - trunk-announce
    - trunk-check-pre-push-always
    - trunk-fmt-pre-commit
    - commitlint
    - trunk-upgrade-available
